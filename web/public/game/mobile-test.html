<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Canvas Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: white; min-height: 100vh; padding: 20px; }
#info {
  background: red;
  color: white;
  padding: 15px;
  font-size: 14px;
  margin-bottom: 20px;
}
#testCanvas {
  display: block;
  background: yellow;
  border: 5px solid blue;
}
.test-div {
  width: 300px;
  height: 200px;
  background: green;
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>
<body>

<div id="info">Loading...</div>

<!-- TINY canvas - 300x200 -->
<canvas id="testCanvas" width="300" height="200"></canvas>

<!-- Regular div for comparison -->
<div class="test-div">DIV TEST</div>

<script>
var info = document.getElementById('info');
var canvas = document.getElementById('testCanvas');

info.innerHTML = 'Screen: ' + window.innerWidth + 'x' + window.innerHeight;

if (canvas) {
  var rect = canvas.getBoundingClientRect();
  info.innerHTML += '<br>Canvas: ' + rect.width + 'x' + rect.height;
  
  var ctx = canvas.getContext('2d');
  if (ctx) {
    ctx.fillStyle = 'purple';
    ctx.fillRect(0, 0, 300, 200);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 30px Arial';
    ctx.fillText('CANVAS OK', 60, 110);
    info.innerHTML += '<br>✅ Drew on canvas!';
  } else {
    info.innerHTML += '<br>❌ No 2D context!';
  }
} else {
  info.innerHTML += '<br>❌ No canvas element!';
}
</script>

</body>
</html>
